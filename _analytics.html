<!--
  ONE measurement ID across every MarineSensitivity product. gtag scopes the
  `_ga` cookie to the registrable domain, so a single stream already spans
  marinesensitivity.org and app.marinesensitivity.org — separate per-product IDs
  would fragment sessions and make cross-product journeys (homepage -> docs ->
  app) unrecoverable. Products are separated in reporting by `content_group`.

  This replaces Quarto's `google-analytics:` key, which cannot set content_group
  (and would double-count page views if both were enabled).
-->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9HW6L751XG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-9HW6L751XG', { content_group: 'home' });
</script>
