      <path d="M451 542 L442 575 L460 595"/>
      <path d="M485 531 L480 575 L504 603"/>
      <path d="M520 532 L527 575 L548 597"/>
      <path d="M550 539 L559 568"/>
    </g>
    <circle cx="522" cy="509" r="4" fill="#FFFFFF" opacity="0.90"/>

    <!-- seabird pair: compact gliders above the title, keeping the wordmark clear -->
    <g transform="translate(1315 68) scale(0.82)" fill="#DFF3FB" opacity="0.60">
      <path d="M0 72 C30 56 62 47 98 50 C126 52 150 62 170 75 C145 69 121 71 103 81 C86 91 75 106 62 124 C53 136 43 143 35 139 C27 135 30 123 38 109 C46 95 55 84 65 77 C48 79 34 83 20 87 C10 90 2 87 0 81 C-2 77 -1 74 0 72 Z"/>
