<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-label="Marine Sensitivity Toolkit">
  <title>Marine Sensitivity Toolkit</title>
  <desc>The wave mark, the 0.05 degree cell grid, the spectral ramp, and refined silhouettes of marine wildlife being scored.</desc>
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A22"/>
      <stop offset="1" stop-color="#173B4B"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2E8FBE"/>
      <stop offset="0.55" stop-color="#3AB2E4"/>
      <stop offset="1" stop-color="#66CDE0"/>
    </linearGradient>
    <linearGradient id="spectral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.000" stop-color="#5E4FA2"/><stop offset="0.100" stop-color="#3288BD"/>
      <stop offset="0.200" stop-color="#66C2A5"/><stop offset="0.300" stop-color="#ABDDA4"/>
      <stop offset="0.400" stop-color="#E6F598"/><stop offset="0.500" stop-color="#FFFFBF"/>
      <stop offset="0.600" stop-color="#FEE08B"/><stop offset="0.700" stop-color="#FDAE61"/>
      <stop offset="0.800" stop-color="#F46D43"/><stop offset="0.900" stop-color="#D53E4F"/>
      <stop offset="1.000" stop-color="#9E0142"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="212" cy="300" r="132"/></clipPath>
    <clipPath id="frame"><rect x="0" y="0" width="1600" height="640"/></clipPath>
  </defs>

  <rect width="1600" height="640" fill="url(#deep)"/>

  <!-- quiet data-grid texture -->
  <g clip-path="url(#frame)" stroke="#7FB6CC" stroke-width="1" opacity="0.19">
    <path d="M0,140 H1600 M0,300 H1600 M0,460 H1600"/>
    <path d="M300,0 V640 M600,0 V640 M900,0 V640 M1200,0 V640 M1500,0 V640"/>
  </g>

