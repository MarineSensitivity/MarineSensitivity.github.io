    </g>

    <!-- tiny spray / motion accents -->
    <g fill="#DFF3FB">
      <circle cx="1112" cy="500" r="5" opacity="0.30"/>
      <circle cx="1090" cy="516" r="3.5" opacity="0.24"/>
      <circle cx="1345" cy="289" r="4" opacity="0.26"/>
      <circle cx="1370" cy="275" r="2.8" opacity="0.20"/>
    </g>
    <path d="M1100 506 C1107 496 1110 486 1108 476" fill="none" stroke="#DFF3FB" stroke-width="3" opacity="0.24" stroke-linecap="round"/>
    <path d="M1362 301 C1366 291 1368 282 1365 274" fill="none" stroke="#00C6D7" stroke-width="3" opacity="0.30" stroke-linecap="round"/>
