  <!-- circular wave mark -->
  <circle cx="212" cy="300" r="132" fill="#0E1B22"/>
  <path clip-path="url(#disc)" fill="url(#sea)"
        d="M60,342 C118,368 170,342 216,300 C255,264 306,247 380,236 L380,470 L60,470 Z"/>
  <path clip-path="url(#disc)" fill="#FFFFFF" opacity="0.22"
        d="M60,378 C124,397 182,376 227,340 C267,308 321,292 380,286 L380,317
           C321,325 271,339 232,372 C186,410 121,422 60,402 Z"/>
  <circle cx="212" cy="300" r="132" fill="none" stroke="#DDE7EC" stroke-width="11"/>

  <!-- typography kept clear above the wildlife field -->
  <g font-family="Avenir Next, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="400" y="252" font-size="112" font-weight="600" fill="#FFFFFF">Marine Sensitivity</text>
    <text x="404" y="316" font-size="38" font-weight="500" letter-spacing="7.5" fill="#9DB4C0">TOOLKIT &#183; BOEM</text>
    <rect x="404" y="352" width="620" height="12" rx="6" fill="url(#spectral)"/>
    <text x="404" y="424" font-size="34" fill="#C9DAE3">Species distributions and extinction risk,</text>
    <text x="404" y="470" font-size="34" fill="#C9DAE3">scored across US ocean waters.</text>
  </g>
</svg>
