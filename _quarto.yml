project:
  type: website
  resources:
    - CNAME

website:
  title: "MarineSensitivity.org"
  site-url: https://MarineSensitivity.org
  repo-url: https://github.com/MarineSensitivity/MarineSensitivity.github.io
  # analytics live in _analytics.html (include-in-header, below) rather than the
  # `google-analytics:` key: the key cannot set `content_group`, which is how the
  # one shared measurement ID separates home / docs / workflows / msens / apps.
  # Enabling both would double-count page views.
  favicon: images/favicon.ico
  twitter-card:
    creator: "@ben_d_best"
    site: "@BOEM"
  open-graph:
    site-name: "MarineSensitivity.org"
  page-footer:
    center: "Sponsored by [Bureau of Ocean Energy Management](https://www.boem.gov/) | Built with [Quarto](https://quarto.org/) | &copy; 2023–2026 [Ben Best](https://bbest.github.io/cv), PhD"

format:
  html:
    theme:
      dark:  [darkly,  styles.scss]
      light: [flatly,  styles.scss]
    toc: false
    page-layout: full
    include-in-header:
      - _analytics.html
