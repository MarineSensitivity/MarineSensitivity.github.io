project:
  type: website
  # quarto renders every .md it finds; keep the agent instructions off the public site
  render:
    - "*.qmd"
    - "*.md"
    - "!CLAUDE.md"
  resources:
    - CNAME
    - branding/mma-seal.svg
    # the homepage hero shows this 216 px render of the seal (57 KB, against 897 KB for the svg)
    - branding/mma-seal-216.png
    - branding/index.html
    # the About icons are CSS masks (inline style), which quarto's resource scan does not follow
    - "images/icons/*.svg"
    - "branding/MMA Branding Guide 2026.pdf"
    # the STAC root catalog, aliased here (workflows/libs/stac_alias.R regenerates it from the
    # canonical tree at file.marinesensitivity.org/stac)
    - stac/catalog.json
    - stac/index.html

website:
  title: "MarineSensitivity.org"
  site-url: https://MarineSensitivity.org
  repo-url: https://github.com/MarineSensitivity/MarineSensitivity.github.io
  # analytics live in _analytics.html (include-in-header, below) rather than the
  # `google-analytics:` key: the key cannot set `content_group`, which is how the
  # one shared measurement ID separates home / docs / workflows / msens / apps.
  # Enabling both would double-count page views.
  favicon: images/favicon.ico
  twitter-card:
    creator: "@ben_d_best"
  open-graph:
    site-name: "MarineSensitivity.org"
  page-footer:
    center: "Sponsored by the [Marine Minerals Administration](https://www.boem.gov/) (formerly the Bureau of Ocean Energy Management) | Built with [Quarto](https://quarto.org/) | &copy; 2023–2026 [Ben Best](https://bbest.github.io/cv), PhD"

format:
  html:
    theme:
      dark:  [darkly,  styles.scss]
      light: [flatly,  styles.scss]
    toc: false
    page-layout: full
    include-in-header:
      - _analytics.html
